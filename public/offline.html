<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9a5a32" />
    <title>Sem conexão — Ministério Apoio</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f4eb;
        color: #3d2a1f;
        font-family: system-ui, sans-serif;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
      }

      main {
        max-width: 24rem;
        text-align: center;
      }

      img {
        width: 7rem;
        height: 7rem;
      }

      h1 {
        font-size: 1.35rem;
        margin: 1rem 0 0.5rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: #6b5344;
      }

      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.6rem;
        background: #9a5a32;
        color: #fbf6ee;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="112" height="112" />
      <h1>Sem conexão</h1>
      <p>
        O Ministério Apoio precisa da internet para carregar os dados. Tente de novo quando a rede
        voltar.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
