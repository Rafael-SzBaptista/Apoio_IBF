    <title>Ministério Apoio</title>
    <style>

      body {

        text-align: center;
        padding: 24px;
      }
      p {
        max-width: 22rem;
        line-height: 1.45;
      }

    <div>
      <p><strong>Ministério Apoio</strong></p>

      </p>
    </div>
